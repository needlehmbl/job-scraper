name: auto-release
# Every push to main is a release: bump the version off the newest tag, push
# the tag, then dispatch release.yml with that tag (a GITHUB_TOKEN push cannot
# trigger a workflow, so the tag push alone is not enough). Manual
# `git tag vX.Y.Z && git push origin vX.Y.Z` still works and builds normally.
#
# The rule is: do work on dev, merge dev -> main only when you want users to
# get it. A push to dev runs nothing. The pytest suite gates the tag, so a red
# test means no release.
on:
  push:
    branches: [main]

# Two pushes racing on the same version must not double-tag.
concurrency:
  group: auto-release
  cancel-in-progress: false

permissions:
  contents: write
  # needed to dispatch release.yml with gh workflow run
  actions: write

jobs:
  # Gate every release on the test suite: a failing test must not produce a tag,
  # because the tag is what triggers the published build for everyone else.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # 3.12 is the version the Docker image and the Windows build use.
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q

  tag:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Full history: the version comes from the newest reachable tag.
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Compute the next version
        id: version
        run: |
          set -euo pipefail
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest tag: $latest"

          # Drop the leading v and any -prerelease suffix; we always bump from
          # the released core version.
          base=${latest#v}
          core=${base%%-*}
          IFS=. read -r maj min pat <<<"$core"

          # A "major:"/"Minor:" prefix on the HEAD subject overrides the
          # default patch bump. Everything else is a patch.
          subject=$(git log -1 --pretty=%s)
          level=patch
          case "$subject" in
            major:* | Major:*) level=major ;;
            minor:* | Minor:*) level=minor ;;
          esac
          echo "HEAD subject: $subject -> $level bump"

          case $level in
            major) next="$((maj + 1)).0.0" ;;
            minor) next="$maj.$((min + 1)).0" ;;
            *) next="$maj.$min.$((pat + 1))" ;;
          esac
          echo "next=v$next" >>"$GITHUB_OUTPUT"

      - name: Skip if that version already exists
        id: check
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.next }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "tag $tag already exists -- nothing to do"
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "will create $tag"
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Tag and push
        if: steps.check.outputs.exists == 'false'
        run: |
          set -euo pipefail
          # An annotated tag needs a committer identity, and actions/checkout
          # does not set one -- without this the step dies with
          # "Committer identity unknown" / "empty ident name".
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="${{ steps.version.outputs.next }}"
          git tag -a "$tag" -m "$(git log -1 --pretty=%B)"
          git push origin "$tag"
          echo "pushed $tag -- now dispatching release.yml"

      # A ref pushed with GITHUB_TOKEN does not trigger workflows, so the tag
      # push above cannot start release.yml by itself. Dispatch it explicitly,
      # pointing at the tag we just created.
      - name: Trigger the release build
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.next }}"
          gh workflow run release.yml --ref main -f "tag=$tag"
          echo "dispatched release.yml for $tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
