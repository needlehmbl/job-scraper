name: release
on:
  push:
    tags: ["v*"]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd dashboard && npm ci && npm run build
      - run: >
          tar -czf jobscraper-linux.tar.gz docker-compose.yml Dockerfile
          .dockerignore run.sh stop.sh setup.sh setup_wizard.py launcher.py
          JobScraper.desktop schema.sql config.yaml .env.example
          dashboard/dist README.md
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: jobscraper-linux.tar.gz
          if-no-files-found: error
  macos:
    # The tarball is pure .py/.sh/JS, so one build serves Intel and Apple
    # Silicon alike -- the runner's own architecture does not matter.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd dashboard && npm ci && npm run build
      - run: >
          tar -czf jobscraper-macos.tar.gz docker-compose.yml Dockerfile
          .dockerignore run.sh stop.sh setup-mac.sh JobScraper.command
          setup_wizard.py launcher.py schema.sql config.yaml .env.example
          dashboard/dist README.md
      - uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: jobscraper-macos.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: cd dashboard; npm ci; npm run build
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m playwright install chromium
      - run: pyinstaller --noconfirm installer/JobScraper.spec
        env: {APP_VERSION: "${{ github.ref_name }}"}
      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/jobscraper.iss
        env: {APP_VERSION: "${{ github.ref_name }}"}
      # Python's zipfile rather than Compress-Archive: the PyInstaller
      # onedir tree is deeply nested and large, and Compress-Archive has a
      # 2 GB per-file limit and is very slow on that shape.
      - name: Zip the portable bundle
        run: |
          python -c "
          import shutil, pathlib
          shutil.make_archive('jobscraper-win64', 'zip', 'dist/JobScraper')
          p = pathlib.Path('jobscraper-win64.zip')
          print(f'jobscraper-win64.zip: {p.stat().st_size/1e6:.1f} MB')
          "
      # iscc writes to installer/Output by default, and upload-artifact only
      # warns when a glob matches nothing -- so a missing Windows build used
      # to leave the release silently without any .exe or .zip. List the files
      # and fail loudly instead.
      - name: Verify Windows artifacts exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path installer\Output -Filter 'JobScraper-Setup-*.exe' -Recurse
          $zip = Get-Item jobscraper-win64.zip -ErrorAction SilentlyContinue
          $exe | ForEach-Object { "installer: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }
          if ($zip) { "portable zip: $($zip.FullName) ($([math]::Round($zip.Length/1MB,1)) MB)" }
          if (-not $exe) { throw "No JobScraper-Setup-*.exe produced -- the installer step did not run." }
          if (-not $zip) { throw "jobscraper-win64.zip was not created." }
          if ($zip.Length -lt 1MB) { throw "jobscraper-win64.zip is only $($zip.Length) bytes -- zipping failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: |
            installer/Output/JobScraper-Setup-*.exe
            jobscraper-win64.zip
          if-no-files-found: error
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {path: assets, merge-multiple: true}
      - run: cd assets && sha256sum * > sha256sums.txt
      - uses: softprops/action-gh-release@v2
        with: {files: "assets/*"}
