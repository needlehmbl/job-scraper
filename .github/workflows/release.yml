name: release
on:
  push:
    tags: ["v*"]
  # auto-release.yml cannot rely on the tag push to start this workflow: a ref
  # pushed with GITHUB_TOKEN does not trigger other workflows. So it dispatches
  # this workflow by hand instead, passing the tag it just created.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v0.2.3"
        required: true
        type: string
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag || github.ref }}"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.4.2"}
      - run: cd dashboard && bun install --frozen-lockfile && bun run build
      - run: ./installer/make-tarball.sh jobscraper-linux.tar.gz
        env: {JOBSCRAPER_VERSION: "${{ inputs.tag || github.ref_name }}"}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: jobscraper-linux.tar.gz
          if-no-files-found: error
  macos:
    # The tarball is pure .py/.sh/JS, so one build serves Intel and Apple
    # Silicon alike -- the runner's own architecture does not matter.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag || github.ref }}"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.4.2"}
      - run: cd dashboard && bun install --frozen-lockfile && bun run build
      - run: ./installer/make-tarball.sh jobscraper-macos.tar.gz
        env: {JOBSCRAPER_VERSION: "${{ inputs.tag || github.ref_name }}"}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-tarball
          path: jobscraper-macos.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.tag || github.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: "1.4.2"}
      - run: cd dashboard; bun install --frozen-lockfile; bun run build
      - run: pip install -r requirements.txt pyinstaller
      - run: python -m playwright install chromium
      # api/routes/admin.py reads this file to report the installed version, and
      # JobScraper.spec ships it into the bundle as a data file. A packaged exe
      # has no environment to be told its version in, so this is the only way.
      - name: Bake the release tag into VERSION
        shell: pwsh
        run: |
          if (-not $env:APP_VERSION) { throw "APP_VERSION is not set" }
          Set-Content -Path VERSION -Value $env:APP_VERSION -NoNewline
          "VERSION baked in: $(Get-Content VERSION)"
        env: {APP_VERSION: "${{ inputs.tag || github.ref_name }}"}
      - run: pyinstaller --noconfirm installer/JobScraper.spec
        env: {APP_VERSION: "${{ inputs.tag || github.ref_name }}"}
      - uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/jobscraper.iss
        env: {APP_VERSION: "${{ inputs.tag || github.ref_name }}"}
      # Python's zipfile rather than Compress-Archive: the PyInstaller
      # onedir tree is deeply nested and large, and Compress-Archive has a
      # 2 GB per-file limit and is very slow on that shape.
      - name: Zip the portable bundle
        run: |
          python -c "
          import shutil, pathlib
          shutil.make_archive('jobscraper-win64', 'zip', 'dist/JobScraper')
          p = pathlib.Path('jobscraper-win64.zip')
          print(f'jobscraper-win64.zip: {p.stat().st_size/1e6:.1f} MB')
          "
      # iscc writes to installer/Output by default, and upload-artifact only
      # warns when a glob matches nothing -- so a missing Windows build used
      # to leave the release silently without any .exe or .zip. List the files
      # and fail loudly instead.
      - name: Verify Windows artifacts exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path installer\Output -Filter 'JobScraper-Setup-*.exe' -Recurse
          $zip = Get-Item jobscraper-win64.zip -ErrorAction SilentlyContinue
          $exe | ForEach-Object { "installer: $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }
          if ($zip) { "portable zip: $($zip.FullName) ($([math]::Round($zip.Length/1MB,1)) MB)" }
          if (-not $exe) { throw "No JobScraper-Setup-*.exe produced -- the installer step did not run." }
          if (-not $zip) { throw "jobscraper-win64.zip was not created." }
          if ($zip.Length -lt 1MB) { throw "jobscraper-win64.zip is only $($zip.Length) bytes -- zipping failed." }
          # A bundle with no VERSION ships as "dev" and never learns about new
          # releases, so a silently missing data file has to fail the build.
          $ver = Get-Item dist\JobScraper\_internal\VERSION -ErrorAction SilentlyContinue
          if (-not $ver) { throw "dist\JobScraper\_internal\VERSION is missing -- the exe cannot report its version." }
          "frozen VERSION: $((Get-Content dist\JobScraper\_internal\VERSION -Raw).Trim())"
      # Collect both Windows artifacts into one flat directory. Uploading the
      # exe from installer/Output/ made download-artifact preserve that nested
      # path, so the publish job's `sha256sum *` hit a directory and failed.
      - name: Stage Windows artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Get-ChildItem -Path installer\Output -Filter 'JobScraper-Setup-*.exe' -Recurse |
            ForEach-Object { Copy-Item $_.FullName out\ }
          Copy-Item jobscraper-win64.zip out\
          Get-ChildItem out | ForEach-Object { "staged: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: out/
          if-no-files-found: error
  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: {path: assets, merge-multiple: true}
      - name: Checksums
        run: |
          cd assets
          find . -maxdepth 1 -type f ! -name 'sha256sums.txt' -printf '%f\n' | sort |
            xargs -r sha256sum > sha256sums.txt
          cat sha256sums.txt
          test -s sha256sums.txt || { echo "::error::no assets found to checksum"; exit 1; }
      # generate_release_notes fills the body from every commit (and PR) since
      # the previous release, so the changelog comes from the commit messages
      # on dev that the merge carried in.
      - uses: softprops/action-gh-release@v2
        with:
          files: "assets/*"
          # On a dispatch, github.ref is the branch, not the tag, so the tag
          # has to be named explicitly.
          tag_name: "${{ inputs.tag || github.ref_name }}"
          generate_release_notes: true
