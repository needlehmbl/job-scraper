# ---------------------------------------------------------------
# EDIT THIS FILE to set what jobs you want. Nothing else to touch
# to change search criteria.
# ---------------------------------------------------------------

search:
  # Keywords / job titles to search for (jobspy runs one search per term).
  # Keep them junior/entry-level friendly -- the experience filter below
  # drops anything that explicitly asks for more than ~2 years.
  search_terms:
    - "Junior Developer"
    - "Junior Fullstack Developer"
    - "Entry Level Developer"
    - "Junior Software Engineer"
    - "Associate Software Engineer"
    - "Junior Python Developer"
    - "Junior Web Developer"
    - "Junior Backend Developer"
    - "Software Engineer Trainee"
    - "Fresh Graduate IT"
    - "IT Support Specialist"
    - "Programmer"
    - "Frontend Developer"
    - "JavaScript Developer"
    - "Java Developer"
    - ".NET Developer"

  # Location string as you'd type it into a job board. Kept tied to
  # Metro Manila + the Philippines Indeed domain so results stay local.
  # NOTE: results are STRICTLY filtered after scraping -- any posting whose
  # location field is outside Metro Manila/NCR (e.g. Cebu, Davao, Cavite,
  # Clark) is dropped regardless of what the search returns (see locations.py).
  location: "Metro Manila, Philippines"

  # true = only remote postings. You want onsite/hybrid, so this stays false --
  # jobspy has no separate "hybrid" filter. IMPORTANT: jobspy's Indeed
  # integration rejects combining is_remote with hours_old in one search
  # (400 error) -- see scraper.py, which only passes is_remote through when
  # it's explicitly true (a remote-only search).
  is_remote: false

  # REQUIRED for Indeed/Glassdoor -- jobspy defaults this to 'USA' if unset,
  # which will 400 or silently search the wrong country. Must match jobspy's
  # exact spelling; see https://github.com/speedyapply/JobSpy for the list.
  country_indeed: "Philippines"

  # JobSpy boards (indeed/linkedin/google) + custom JobStreet and
  # Glassdoor scrapers (headless Chromium). ZipRecruiter is US/CA-only;
  # bayt/naukri/bdjobs are Middle East/India/Bangladesh-focused -- all
  # skipped for a Metro Manila search. Glassdoor's jobspy integration is
  # bot-walled (verified 2026-09-21), so `glassdoor` here routes to
  # glassdoor.py instead -- keep it listed. Google Jobs currently returns
  # zero rows upstream (JobSpy parser broken) -- the scrape warnings flag
  # it if so.
  site_names:
    - "indeed"
    - "linkedin"
    - "jobstreet"
    - "glassdoor"
    # NOTE: "google" disabled -- JobSpy's Google parser returns 0 rows
    # upstream (broken), so listing it only burns 16 searches per run.
    # Re-enable when the parser is fixed.

  # How far back to look
  hours_old: 672

  # Max results pulled per search term per job board
  results_wanted: 100

  # LinkedIn listings don't include the description until jobspy visits each
  # posting. Keep this true or descriptions come back empty and the
  # experience-requirement filter below has nothing to work with.
  linkedin_fetch_description: true

  # Experience ceiling: a posting that EXPLICITLY requires more than this
  # many years (parsed from the description, e.g. "3-5 years experience") is
  # dropped. Postings that don't state any requirement are kept.
  max_experience_years: 2

  # Case-insensitive substring match against the job title, applied before
  # the years filter. Anything matching is dropped.
  exclude_title_keywords:
    - "intern"
    - "unpaid"
    - "seminar"
    - "senior"
    - "lead"
    - "principal"
    - "staff"
    - "manager"
    - "director"

  # REQUIRED relevance gate: the title must contain at least one of these
  # (case-insensitive substring), or the posting is dropped. Job boards do
  # loose relevance matching -- without this, searches like "Fresh Graduate
  # IT" return Trucking Coordinators, Radiologic Technologists, and Hotel
  # Receptionists, and JobStreet in particular returns the same generic soup
  # for every term. Empty list disables the gate (keeps everything).
  include_title_keywords:
    - "developer"
    - "software"
    - "programmer"
    - "engineer"
    - "web"
    - "mobile"
    - "frontend"
    - "front-end"
    - "backend"
    - "back-end"
    - "fullstack"
    - "full stack"
    - "full-stack"
    - "data"
    - "python"
    - "java"
    - "qa"
    - "tester"
    - "devops"
    - "cloud"
    - "support"
    - "helpdesk"
    - "help desk"
    - "service desk"
    - "desktop"
    - "technician"
    - "trainee"
    - "graduate"
    - "apprentice"
    - "cadet"
    - "systems"
    - "analyst"
    - "architect"
    - "consultant"
    - "specialist"

  exclude_company_keywords: []

# Feedback learner: the scraper learns from your dashboard decisions
# (SKIP/MISMATCH/EXP_GAP vs APPLIED/REVIEWED) and drops new postings
# like the ones you skipped. Heuristic layer always runs once you have
# min_samples decided jobs; the AI layer additionally asks an LLM when
# an API key is present in .env (GROQ > OpenRouter > Mistral > Gemini).
feedback:
  enabled: true
  # Decided jobs needed before learning kicks in (dashboard statuses
  # APPLIED/REVIEWED count as good, SKIP/MISMATCH/EXP_GAP as bad;
  # APPLIED rows at the OUT funnel stage are excluded either way).
  # MISMATCH = wrong role/field/city fit, EXP_GAP = needs more experience.
  min_samples: 10
  # A title token is auto-excluded once it appears in >= min_hits
  # decided jobs with >= min_reject_rate of them skipped.
  # SKIP, MISMATCH and EXP_GAP all count as "bad" everywhere below.
  # MISMATCH and EXP_GAP are finer-grained negative reasons, same weight.
  min_hits: 2
  min_reject_rate: 0.8
  # Same idea for two-word phrases ("power platform", "civil engineer"),
  # which are more precise than single tokens.
  min_phrase_hits: 2
  # Same idea for companies (e.g. a staffing firm you always skip).
  auto_exclude_companies: true
  min_company_hits: 2
  min_company_reject_rate: 0.75
  # Stack-skill learning from titles+descriptions: canonical stack names
  # (Python, Salesforce, …) that overwhelmingly appear in postings you
  # reject/skip are auto-excluded -- so a generic "Associate Engineer"
  # title hiding a Salesforce description gets caught with no explicit
  # note from you. Descriptions are stored per row from the scrape that
  # adds them; older rows teach via title only.
  learn_desc_skills: true
  # AI re-check of the new batch against GOOD/BAD examples.
  use_ai: true
  # auto|groq|openrouter|mistral|gemini|off -- auto picks the first
  # provider with a key in .env.
  ai_provider: auto
  # Override the per-provider default model (e.g. "llama-3.1-70b-versatile").
  ai_model: ""
  max_jobs_per_ai_call: 60
  max_examples_per_side: 30
  # Description context per posting in the filter prompt (chars,
  # whitespace-collapsed, ~4 chars/token). 1000 ≈ 250 tokens/posting.
  ai_desc_chars: 1000
  # Chunking: the batch is scored in chunks of this many postings (one
  # LLM call each), up to ai_max_chunks_per_scrape chunks per scrape.
  # The remainder is heuristic-only. Chunks fail over across providers
  # (groq -> openrouter -> mistral -> gemini): if one chokes, the next
  # picks the chunk up, so no single outage kills the run.
  ai_jobs_per_call: 40
  ai_max_chunks_per_scrape: 3
  # Rate limiter for AI scoring (protects free-tier quotas). At most one
  # scoring call happens per scrape, so these are daily guardrails tracked
  # in usage_state.json (gitignored, resets each day).
  min_seconds_between_calls: 2
  max_ai_calls_per_day: 20
  max_ai_tokens_per_day: 100000
  usage_state_path: "usage_state.json"

# Direct company career boards (Tier 1): public Greenhouse/Lever JSON APIs,
# no browser needed. Slug = the board path (boards.greenhouse.io/<slug>,
# lever.co/<slug>). Plain list uses the slug as the company name; mapping
# form sets a display name, e.g. greenhouse: {"acme": "Acme Corp"}.
# Board pulls ignore `hours_old` (career pages list evergreen postings;
# dedupe keeps re-scrapes clean) and use a looser location gate (bare
# "Philippines" / remote-PH passes; named non-NCR cities still fail).
# Slugs below were validated live 2026-09-20; a dead board only logs a
# warning and never breaks the rest of the scrape.
company_boards:
  greenhouse:
    - "moneysmart"        # Software Developer - Full Stack, Philippines
    - "perform-careers"   # Python/AI Full-Stack Developer, Manila
    # - "workstream"      # Manila roles, mostly senior/non-dev
    # - "eucalyptus"      # 30+ Manila rows, mostly clinical/support
    # - "cteph"           # remote-PH incl. DevOps roles
  lever:
    - "coins"             # Coins.ph, Taguig

# Glassdoor search locations as {slug, id} pairs (glassdoor.py, headless
# Chromium -- jobspy's Glassdoor integration is bot-walled). The numeric
# ID is NOT resolvable programmatically (the autocomplete endpoint is the
# walled one) -- copy the IC number out of any browser Glassdoor search
# URL for each city you want (e.g. ..._IC4778930_... in the URL). One
# results page (30 cards) is read per term per location, with a cooldown
# between loads; cards carry no usable age, so these skip the hours_old
# gate like company boards.
glassdoor_locations:
  - {slug: "Makati City", id: 4778930}   # verified live 2026-09-21

# Local output file -- one row per NEW job, appended across runs.
# Existing rows are preserved; re-scraped jobs are skipped as duplicates.
paths:
  tracker_sheet: "applications.xlsx"
  # One-line summary of every finished run (written by main.py). The
  # notification daemon tails this and pops a desktop notification.
  runs_log: "runs.log"
